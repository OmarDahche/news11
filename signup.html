<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center min-h-screen bg-gradient-to-b from-red-900 via-black to-gray-800">
    <div class="p-8 rounded-3xl shadow-2xl max-w-md w-full bg-gradient-to-tr from-red-700 to-gray-800">
        <h2 class="text-white text-3xl font-bold mb-4">Registration</h2>
        <p class="text-gray-300 mb-6">Please provide the following to verify your identity</p>
        <form>
            <div class="mb-6">
                <label class="block text-white mb-2" for="fullname">Full Name</label>
                <input type="text" id="fullname" class="w-full p-3 border-2 border-gray-500 rounded-xl bg-transparent text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>
            <div class="mb-6">
                <label class="block text-white mb-2" for="email">Email</label>
                <input type="email" id="email" class="w-full p-3 border-2 border-gray-500 rounded-xl bg-transparent text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>
            <div class="mb-6">
                <label class="block text-white mb-2" for="password">Password</label>
                <input type="password" id="password" class="w-full p-3 border-2 border-gray-500 rounded-xl bg-transparent text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>
            <div class="mb-6">
                <label class="inline-flex items-center text-gray-300">
                    <input type="checkbox" class="form-checkbox border-gray-500 text-red-600 focus:ring-2 focus:ring-red-600">
                    <span class="ml-2">I agree to the terms & conditions</span>
                </label>
            </div>
            <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-600">Register</button>
            <p class="text-gray-300 text-center mt-6">Already have an account? <a href="#" class="underline text-red-400 hover:text-white">Login</a></p>
        </form>
        <div class="mt-6 space-y-4">
            <button class="w-full border-2 border-gray-500 text-gray-300 py-3 rounded-xl flex items-center justify-center hover:bg-gray-900 hover:text-white">
                <span class="mr-2">G</span>Login with Google
            </button>
            <button class="w-full border-2 border-gray-500 text-gray-300 py-3 rounded-xl flex items-center justify-center hover:bg-gray-900 hover:text-white">
                <span class="mr-2">F</span>Login with Facebook
            </button>
        </div>
    </div>
</body>
</html>
